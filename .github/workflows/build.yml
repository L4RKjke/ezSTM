name: Build ezSTM for Windows

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check project structure
        shell: pwsh
        run: |
          $required = @(
            "main.py",
            "requirements.txt",
            "payload\read.bat",
            "payload\write.bat",
            "payload\bin\stm32pr.exe",
            "payload\check.svg",
            "payload\icon.ico"
          )

          $missing = $required | Where-Object {
            -not (Test-Path $_ -PathType Leaf)
          }
          if ($missing) {
            throw "Отсутствуют файлы: $($missing -join ', ')"
          }

          if (Test-Path "payload\fw.bin") {
            throw "payload\fw.bin должен быть удалён из репозитория."
          }

      - name: Create virtual environment
        shell: pwsh
        run: python -m venv .venv

      - name: Upgrade pip
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip install --upgrade pip

      - name: Install dependencies
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Build ezSTM
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m PyInstaller `
              --noconfirm `
              --clean `
              --onefile `
              --windowed `
              --name ezSTM `
              --icon payload\icon.ico `
              --add-data "payload;payload" `
              main.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ezSTM-Windows
          path: dist/ezSTM.exe
          if-no-files-found: error
          retention-days: 30
