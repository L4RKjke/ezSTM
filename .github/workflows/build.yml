name: Build and Release ezSTM for Windows

on:
  push:
    branches: ["dev", "main"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Какой номер версии увеличить"
        type: choice
        options: [patch, minor, major]
        default: patch


# Разрешение на создание тегов, релизов и загрузку файлов.
permissions:
  contents: write

# Не допускаем одновременной публикации двух релизов.
concurrency:
  group: ezstm-windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check project structure
        shell: pwsh
        run: |
          $required = @(
            "main.py",
            "requirements.txt",
            "payload\read.bat",
            "payload\write.bat",
            "payload\bin\stm32pr.exe",
            "payload\check.svg",
            "payload\icon.ico"
          )

          $missing = $required | Where-Object {
            -not (Test-Path $_ -PathType Leaf)
          }

          if ($missing) {
            throw "Отсутствуют файлы: $($missing -join ', ')"
          }

          if (Test-Path "payload\fw.bin") {
            throw "payload\fw.bin должен быть удалён из репозитория."
          }

      - name: Create virtual environment
        shell: pwsh
        run: python -m venv .venv

      - name: Upgrade pip
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip install --upgrade pip

      - name: Install dependencies
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Build ezSTM
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m PyInstaller `
              --noconfirm `
              --clean `
              --onefile `
              --windowed `
              --name ezSTM `
              --icon payload\icon.ico `
              --add-data "payload;payload" `
              --collect-data ezstm `
              main.py

          if ($LASTEXITCODE -ne 0) {
            throw "Ошибка сборки PyInstaller."
          }

          if (-not (Test-Path "dist\ezSTM.exe" -PathType Leaf)) {
            throw "Файл dist\ezSTM.exe не создан."
          }

      - name: Upload executable to Actions
        uses: actions/upload-artifact@v4
        with:
          name: ezSTM-Windows
          path: dist/ezSTM.exe
          if-no-files-found: error
          retention-days: 30

      - name: Show branch info
        shell: pwsh
        run: 'Write-Host "Ветка $env:GITHUB_REF_NAME: релиз не создаётся, только сборка и артефакт."'


      - name: Create and publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("node:fs/promises");
            const { owner, repo } = context.repo;

            const semverRe = /^v?(\d+)\.(\d+)\.(\d+)$/;

            // Получаем все релизы (включая черновики) и ищем максимальную версию.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            let max = null;

            for (const r of releases) {
              const m = semverRe.exec(r.tag_name);
              if (!m) continue;

              const v = [Number(m[1]), Number(m[2]), Number(m[3])];

              if (
                max === null ||
                v[0] > max[0] ||
                (v[0] === max[0] && v[1] > max[1]) ||
                (v[0] === max[0] && v[1] === max[1] && v[2] > max[2])
              ) {
                max = v;
              }
            }

            // Тип увеличения: при push — patch, при ручном запуске — из входного параметра.
            const bump = context.payload.inputs?.bump ?? "patch";

            let version = "v1.0.0";

            if (max !== null) {
              let [major, minor, patch] = max;

              if (bump === "major") {
                major += 1;
                minor = 0;
                patch = 0;
              } else if (bump === "minor") {
                minor += 1;
                patch = 0;
              } else {
                patch += 1;
              }

              version = `v${major}.${minor}.${patch}`;
            }

            core.info(`Новый релиз: ${version} (bump: ${bump})`);

            // Проверяем, что тега с таким именем ещё нет.
            const exists = await github.rest.repos
              .getReleaseByTag({ owner, repo, tag: version })
              .then(() => true)
              .catch((error) => {
                if (error.status === 404) return false;
                throw error;
              });

            if (exists) {
              throw new Error(`Релиз ${version} уже существует.`);
            }

            const executable = await fs.readFile("dist/ezSTM.exe");

            // Сначала создаём черновик, чтобы не публиковать релиз без EXE.
            const { data: release } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: version,
              target_commitish: context.sha,
              name: `ezSTM ${version}`,
              body: [
                "Автоматическая сборка ezSTM для Windows.",
                "",
                "Скачайте ezSTM.exe из раздела Assets.",
                "",
                `Коммит: ${context.sha}`,
                `Запуск Actions: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              ].join("\n"),
              draft: true,
              prerelease: false,
            });

            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: "ezSTM.exe",
              headers: {
                "content-type": "application/octet-stream",
                "content-length": executable.length,
              },
              data: executable,
            });

            // Публикуем только после успешной загрузки файла.
            const { data: published } = await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              draft: false,
              prerelease: false,
              make_latest: "true",
            });

            core.info(`Релиз опубликован: ${published.html_url}`);

            await core.summary
              .addHeading(`Опубликован ezSTM ${version}`)
              .addLink("Открыть релиз", published.html_url)
              .write();
