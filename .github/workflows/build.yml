name: Build ezSTM for Windows

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

# Не допускаем одновременное обновление релиза.
concurrency:
  group: ezstm-windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Create virtual environment
        shell: pwsh
        run: python -m venv .venv

      - name: Upgrade pip
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip install --upgrade pip

      - name: Install dependencies
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Build ezSTM
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m PyInstaller `
              --noconfirm `
              --clean `
              --onefile `
              --windowed `
              --name ezSTM `
              --add-data "payload;payload" `
              --collect-data ezstm `
              main.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ezSTM-Windows
          path: dist/ezSTM.exe
          if-no-files-found: error
          retention-days: 30

      - name: Update latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: ezSTM — последняя сборка Windows
          body: |
            Автоматическая сборка ezSTM для Windows из ветки main.
            Скачайте ezSTM.exe из раздела Assets ниже.
            Коммит: ${{ github.sha }}
            Сборка: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/ezSTM.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}