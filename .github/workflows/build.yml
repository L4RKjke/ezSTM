name: Build ezSTM and Create Release

on:
  push:
    branches: ["dev", "main"]
  workflow_dispatch:

permissions:
  contents: write

# Не допускаем параллельной публикации релизов.
concurrency:
  group: ezstm-windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check project structure
        shell: pwsh
        run: |
          $required = @(
            "main.py",
            "requirements.txt",
            "ezstm\__init__.py",
            "payload\read.bat",
            "payload\write.bat",
            "payload\bin\stm32pr.exe",
            "payload\check.svg",
            "payload\icon.ico"
          )

          $missing = $required | Where-Object {
            -not (Test-Path $_ -PathType Leaf)
          }

          if ($missing) {
            throw "Отсутствуют файлы: $($missing -join ', ')"
          }

          if (Test-Path "payload\fw.bin") {
            throw "payload\fw.bin должен быть удалён из репозитория."
          }

      - name: Read version from ezstm/__init__.py
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "ezstm\__init__.py"
          $content = Get-Content $file -Raw -Encoding utf8

          if ($content -notmatch '(?m)^\s*version\s*=\s*["''](?<v>[^"'']+)["'']') {
            throw "Не удалось найти строку version = ""..."" в $file."
          }

          $version = $Matches['v'].Trim()

          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.]+)?$') {
            throw "Некорректный формат версии: '$version'."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
          Write-Host "Версия проекта: $version"

      - name: Create virtual environment
        shell: pwsh
        run: python -m venv .venv

      - name: Upgrade pip
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip install --upgrade pip

      - name: Install dependencies
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Build ezSTM
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m PyInstaller `
              --noconfirm `
              --clean `
              --onefile `
              --windowed `
              --name ezSTM `
              --icon payload\icon.ico `
              --add-data "payload;payload" `
              --collect-data ezstm `
              main.py

          if ($LASTEXITCODE -ne 0) {
            throw "Ошибка сборки PyInstaller."
          }

          if (-not (Test-Path "dist\ezSTM.exe" -PathType Leaf)) {
            throw "Файл dist\ezSTM.exe не создан."
          }

      - name: Upload executable to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ezSTM-Windows-v${{ steps.version.outputs.version }}-${{ github.sha }}
          path: dist/ezSTM.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create release for new version
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $exe    = "dist\ezSTM.exe"
          $tag    = "v$env:VERSION"
          $commit = $env:GITHUB_SHA
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

          # Проверяем, существует ли уже релиз с таким тегом.
          # Если нет, gh вернёт ненулевой код, это не ошибка.
          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"

          if ($exists) {
            Write-Host "Релиз $tag уже существует. Новый релиз не создаётся."
            Write-Host "Чтобы выпустить новую сборку, увеличьте version в ezstm/__init__.py."
            "## Релиз $tag уже существует, пропущено" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $notes = @(
            "Автоматическая сборка ezSTM $tag для Windows.",
            "",
            "Коммит: $commit",
            "Запуск Actions: $runUrl"
          ) -join "`n"

          gh release create $tag $exe `
            --target $commit `
            --title "ezSTM $tag" `
            --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "Не удалось создать релиз $tag." }

          Write-Host "Релиз $tag создан."

          "## Создан релиз ezSTM $tag" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "[Открыть релиз](https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
